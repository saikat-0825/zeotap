

services:
  postgres:
    image: postgres:15-alpine
    container_name: ims_postgres
    environment:
      POSTGRES_USER: ims_user
      POSTGRES_PASSWORD: ims_password
      POSTGRES_DB: ims_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ims_user -d ims_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    container_name: ims_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ims_redis
    ports:
      - "6379:6379"

  api:
    build: 
      context: ./backend
    container_name: ims_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://ims_user:ims_password@postgres:5432/ims_db
      - MONGO_URI=mongodb://admin:adminpassword@mongodb:27017/
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  worker:
    build: 
      context: ./backend
    container_name: ims_worker
    command: python worker.py
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://ims_user:ims_password@postgres:5432/ims_db
      - MONGO_URI=mongodb://admin:adminpassword@mongodb:27017/
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started

volumes:
  postgres_data:
  mongo_data: