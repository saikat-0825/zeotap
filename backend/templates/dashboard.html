{% extends "base.html" %}
{% block content %}
<h1 class="text-3xl font-bold mb-8 text-blue-400">Mission-Critical IMS</h1>
<div class="grid grid-cols-3 gap-6">
    <div class="col-span-2 bg-gray-800 p-6 rounded-lg shadow border border-gray-700">
        <h2 class="text-xl font-semibold mb-4 text-gray-300">Active Incidents (Live)</h2>
        <table class="min-w-full text-left text-sm">
            <thead class="border-b border-gray-700">
                <tr><th>ID</th><th>Component</th><th>Severity</th><th>State</th></tr>
            </thead>
            <tbody hx-get="/partials/active-incidents" hx-trigger="every 5s" hx-swap="innerHTML">
                <tr><td colspan="4" class="py-4 text-gray-500">Loading live feed...</td></tr>
            </tbody>
        </table>
    </div>
    <div class="col-span-1 bg-gray-800 p-6 rounded-lg shadow border border-gray-700">
        <h2 class="text-xl font-semibold mb-4 text-gray-300">Submit RCA</h2>
        {% include "rca_modal.html" %}
    </div>
</div>
{% endblock %}
